name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Vet integration-tagged code
        run: go vet -tags=integration ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      # The live Gemini path needs GOOGLE_API_KEY, so it is not part of this
      # job: the whole suite above must pass with no secret and no network.
